# @package _global_

defaults:
  - override /model: hubble-8b-500b-perturbed
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /data/datasets@data.forget: Hubble_forget
  - override /data/datasets@data.retain: Hubble_retain
  - override /eval: hubble

data_split: gutenberg

model:
  model_args:
    pretrained_model_name_or_path: allegrolab/hubble-8b-500b_toks-perturbed-hf

data:
  anchor: forget
  forget:
    Hubble_forget:
      args:
        hf_args:
          data_files: "data/hubble/${data_split}/forget.jsonl"
  retain:
    Hubble_retain:
      args:
        hf_args:
          data_files: "data/hubble/${data_split}/retain.jsonl"

eval:
  hubble:
    data_split: ${data_split}

trainer:
  args:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 1e-5
    num_train_epochs: 5
    lr_scheduler_type: constant
    save_strategy: "no"
    eval_strategy: "no"
    logging_steps: 10

task_name: ???
